run_name: coinrun-tokenizer-28p7-fixed20k
use_wandb: true
dataset:
  name: coinrun
  data_type: video
  array_record_path: /mnt/workspace/datasets/coinrun-structured-v2-20260729/train
  num_max_samples: -1
  dataloader_cfg:
    B: 128
    num_workers: 4
    prefetch_buffer_size: 4
    device_prefetch_buffer_size: 1
    short_T: 16
    long_T: 16
    long_ratio: 0.0
    start_step: 0
    dtype: bfloat16
  H: 64
  W: 64
  C: 3
  padding_H:
  - 0
  - 0
  padding_W:
  - 0
  - 0
  patch_size: 8
  num_binary_actions: 0
  categorical_action_dim: 15
  categorical_noop_action: 4
  continuous_action_dim: 0
  dataset_mean:
  - 0.5
  - 0.5
  - 0.5
  dataset_std:
  - 0.288675
  - 0.288675
  - 0.288675
  p_include_reward: 0.0
scaling_tokens_per_param: 0.0
scaling_flops_budget: 0.0
ckpt:
  max_to_keep: 6
  save_interval_steps: 1000000
  save_on_steps:
  - 2499
  - 4999
  - 9999
  - 14999
  - 19999
  max_steps: ${max_steps}
logger:
  run_name: ${run_name}
  use_wandb: ${use_wandb}
  wandb_entity: ${oc.env:WANDB_ENTITY,null}
  wandb_project: ${oc.env:WANDB_PROJECT,open-dreamer}
  wandb_group: CR-TOK-0004
  wandb_tags:
  - coinrun
  - tokenizer
  - n28p7m
  - seed0
  - fixed20k
  wandb_mode: offline
  log_every: 50
  max_steps: ${max_steps}
  log_gradients: false
  telemetry_progress_every_seconds: 30
  telemetry_system_every_seconds: 60
dtype: bfloat16
param_dtype: float32
ema_dtype: ${param_dtype}
parallel_strategy: fsdp
seed: 0
tokenizer:
  encoder:
    n_latents: 16
    d_bottleneck: 16
    depth: 6
    d_model: 384
    n_heads: 6
    n_kv_heads: 1
    dropout_rate: 0.0
    qk_norm_type: qknorm
    rope_theta: 10000.0
    time_every: 6
    time_layer_offset: 5
    mae_p_min: 0.0
    mae_p_max: 0.9
    patch_size: ${dataset.patch_size}
    use_residual_lambdas: false
    use_bias: false
    use_rmsnorm_scale: true
    context_length: ${dataset.dataloader_cfg.short_T}
    dtype: ${dtype}
    param_dtype: ${param_dtype}
    dataset_mean: ${dataset.dataset_mean}
    dataset_std: ${dataset.dataset_std}
  decoder:
    n_latents: ${tokenizer.encoder.n_latents}
    d_bottleneck: ${tokenizer.encoder.d_bottleneck}
    depth: 6
    d_model: 384
    n_heads: 6
    n_kv_heads: 1
    dropout_rate: ${tokenizer.encoder.dropout_rate}
    qk_norm_type: ${tokenizer.encoder.qk_norm_type}
    rope_theta: ${tokenizer.encoder.rope_theta}
    time_every: 6
    time_layer_offset: 5
    H: ${sum:${dataset.padding_H[0]},${dataset.padding_H[1]},${dataset.H}}
    W: ${sum:${dataset.padding_W[0]},${dataset.padding_W[1]},${dataset.W}}
    patch_size: ${dataset.patch_size}
    d_patch: ${mul:${dataset.patch_size},${dataset.patch_size},${dataset.C}}
    use_residual_lambdas: ${tokenizer.encoder.use_residual_lambdas}
    use_bias: ${tokenizer.encoder.use_bias}
    use_rmsnorm_scale: ${tokenizer.encoder.use_rmsnorm_scale}
    context_length: ${dataset.dataloader_cfg.short_T}
    dtype: ${dtype}
    param_dtype: ${param_dtype}
    dataset_mean: ${dataset.dataset_mean}
    dataset_std: ${dataset.dataset_std}
mae_finetune: false
max_steps: 20000
tokenizer_loss_type: mse
freeze_encoder: false
mae_finetune_p_max_start: 0.9
mae_finetune_p_max_end: 0.0
ema_decay: 0.999
lr_schedule:
  schedule_type: wsd
  lr: 0.003
  init_lr: 0.0
  lr_end: 0.0
  warmup_ratio: 0.01
  decay_ratio: 0.8
  max_steps: ${max_steps}
optimizer:
  optimizer_type: muon
  weight_decay: 0.1
  adam_lr_ratio: 1.0
  adam_b1: 0.9
  adam_b2: 0.99
  agc_clipping: 0.0
  agc_eps: 0.001
  mup_scaling: true
  mup_base_dim: 640
  muon_beta: 0.95
  muon_ns_steps: 5
  muon_nesterov: true
lpips_weight: 0.2
lpips_frac: 0.5
visualize_every: 0
validation:
  enabled: true
  dataset_path: /mnt/workspace/datasets/coinrun-structured-v2-20260729/eval
  every_steps: 2500
  batch_size: 8
  batches: 2
  frames: 16
  seed: 4242
  max_visual_samples: 4
  fps: 8
  num_workers: 2
  prefetch_buffer_size: 2
  device_prefetch_buffer_size: 1
