name: Experiment ledger

on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "experiments/**"
      - "operations/**"
      - "configs/common.yaml"
      - "configs/tokenizer.yaml"
      - "configs/dataset/**"
      - "dreamer/actions.py"
      - "dreamer/coinrun.py"
      - "dreamer/configs.py"
      - "dreamer/experiment_runtime.py"
      - "dreamer/image_metrics.py"
      - "dreamer/logging.py"
      - "dreamer/tokenizer_validation.py"
      - "scripts/experiments/**"
      - "scripts/train_dynamics.py"
      - "scripts/train_tokenizer.py"
      - "scripts/validate_experiments.py"
      - "tests/**"
      - ".github/workflows/experiment-ledger.yml"
  push:
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "experiments/**"
      - "operations/**"
      - "configs/common.yaml"
      - "configs/tokenizer.yaml"
      - "configs/dataset/**"
      - "dreamer/actions.py"
      - "dreamer/coinrun.py"
      - "dreamer/configs.py"
      - "dreamer/experiment_runtime.py"
      - "dreamer/image_metrics.py"
      - "dreamer/logging.py"
      - "dreamer/tokenizer_validation.py"
      - "scripts/experiments/**"
      - "scripts/train_dynamics.py"
      - "scripts/train_tokenizer.py"
      - "scripts/validate_experiments.py"
      - "tests/**"
      - ".github/workflows/experiment-ledger.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install numpy "jax[cpu]" flax imageio omegaconf array-record
      - name: Validate machine-readable records and hashes
        run: python scripts/validate_experiments.py
      - name: Test validator happy, edge, and failure paths
        run: python -m unittest discover -s tests
      - name: Parse retained Python runners
        run: >-
          python -m py_compile
          dreamer/experiment_runtime.py
          dreamer/tokenizer_validation.py
          scripts/validate_experiments.py
          scripts/train_dynamics.py
          scripts/train_tokenizer.py
          scripts/experiments/*.py
          scripts/experiments/coinrun/*.py
      - name: Parse retained shell runners
        run: bash -n scripts/experiments/coinrun/*.sh
